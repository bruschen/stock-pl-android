name: Verify APK on emulator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APK from apk branch
        run: |
          git fetch --depth 1 origin apk
          git show FETCH_HEAD:stock-pl-debug.apk > app-debug.apk
          mkdir -p out
          git log -1 --format=%s FETCH_HEAD | tee out/apk-version.txt

      - name: Check Yahoo endpoint from runner
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Linux; Android) StockPL/1.0"
          curl -s -A "$UA" -o out/yahoo-2330.json -w "%{http_code}\n" \
            "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?interval=1m&range=1d" > out/yahoo-2330-status.txt || true
          curl -s -A "$UA" -o out/yahoo-9999.json -w "%{http_code}\n" \
            "https://query1.finance.yahoo.com/v8/finance/chart/9999.TW?interval=1m&range=1d" > out/yahoo-9999-status.txt || true
          curl -s -A "$UA" -o out/yahoo-2330-zh.json -w "%{http_code}\n" \
            "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?interval=1m&range=1d&lang=zh-Hant-TW&region=TW" > out/yahoo-2330-zh-status.txt || true

      - name: Install test tools
        run: pip install websocket-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          profile: pixel_6
          script: bash .github/scripts/verify.sh

      - name: Publish results to verify branch
        if: always()
        run: |
          mkdir -p out
          cd out
          git init -q -b verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Verify results from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" verify
